<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G2 월별 교인 기도수첩</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; background: #f4f6f9; color: #2d3748; }
    h2 { font-size: 1.25rem; margin-top: 0; color: #1a202c; }
    .card { background: #ffffff; padding: 14px; border-radius: 10px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    label { font-size: 0.85rem; font-weight: 600; color: #4a5568; display: block; margin-bottom: 4px; }
    select, input, textarea { width: 100%; box-sizing: border-box; margin-bottom: 10px; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.95rem; }
    button { width: 100%; padding: 12px; background: #3182ce; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:active { background: #2b6cb0; }
    .status { font-size: 0.88rem; color: #718096; line-height: 1.4; }
    .badge { display: inline-block; padding: 2px 6px; background: #e2e8f0; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .active-badge { background: #c6f6d5; color: #22543d; }
  </style>
</head>
<body>
  <h2>G2 월별 교인 기도수첩</h2>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span id="bridge-badge" class="badge">연결 대기 중</span>
      <span id="mic-badge" class="badge">음성 대기</span>
    </div>
    <div id="status-text" class="status">시스템을 시작하는 중입니다...</div>
    <div id="hud-preview" style="margin-top: 10px; padding: 8px; background: #edf2f7; border-radius: 6px; font-size: 0.9rem; font-weight: 500;">
      안경 표시 내용: 대기 중
    </div>
  </div>

  <div class="card">
    <label for="month-select">조회 및 적용할 월 선택</label>
    <select id="month-select"></select>
  </div>

  <div class="card">
    <h3>이번 달 기도제목 추가</h3>
    <input type="text" id="input-name" placeholder="교인 성함 (예: 김철수)" />
    <input type="text" id="input-title" placeholder="직분 (예: 성도, 집사, 권사)" />
    <textarea id="input-prayer" rows="3" placeholder="기도제목 입력 (2~3줄 권장)"></textarea>
    <button id="btn-save">기도제목 저장</button>
  </div>

  <script>
    let monthlyData = [
      {
        month: "2026-10",
        list: [
          { id: "1", name: "김철수", title: "성도", prayer: "새로운 직장 적응과 건강 회복, 가정의 평안" },
          { id: "2", name: "이영희", title: "집사", prayer: "자녀 학업과 진로 인도하심, 영적 성장" },
          { id: "3", name: "박민수", title: "권사", prayer: "구역 식구들의 영적 회복과 환우들을 위한 중보" }
        ]
      }
    ];

    let currentMonth = "2026-10";
    let activeList = [];
    let bridge = null;
    let recognition = null;

    async function getEvenBridge() {
      if (window.EvenAppBridge) return window.EvenAppBridge;
      if (window.evenApp) return window.evenApp;
      return new Promise((resolve) => {
        let count = 0;
        const timer = setInterval(() => {
          const b = window.EvenAppBridge || window.evenApp;
          if (b) {
            clearInterval(timer);
            resolve(b);
          }
          count++;
          if (count > 20) {
            clearInterval(timer);
            resolve(null);
          }
        }, 100);
      });
    }

    async function renderToGlasses(titleText, contentText) {
      const fullText = `[기도수첩] ${titleText}\n--------------------\n${contentText}`;
      if (!bridge) {
        console.log('[Mock Glasses HUD]:', fullText);
        return;
      }
      try {
        if (typeof bridge.sendStartUpPage === 'function') {
          await bridge.sendStartUpPage({
            containers: [{ x: 0, y: 0, width: 576, height: 288, text: fullText }]
          });
        } else if (typeof bridge.sendText === 'function') {
          await bridge.sendText(fullText);
        }
      } catch (e) {
        console.error('HUD 전송 에러:', e);
      }
    }

    function loadData() {
      const saved = localStorage.getItem('g2_monthly_prayers');
      if (saved) {
        try {
          monthlyData = JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
      }
      updateMonthSelectorUI();
      setActiveMonth(currentMonth);
    }

    function saveData() {
      localStorage.setItem('g2_monthly_prayers', JSON.stringify(monthlyData));
    }

    function updateMonthSelectorUI() {
      const selector = document.getElementById('month-select');
      if (!selector) return;
      selector.innerHTML = '';
      monthlyData.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.month;
        opt.innerText = `${item.month} 기도제목 (${item.list.length}명)`;
        if (item.month === currentMonth) opt.selected = true;
        selector.appendChild(opt);
      });
    }

    function setActiveMonth(monthStr) {
      currentMonth = monthStr;
      let found = monthlyData.find(m => m.month === monthStr);
      if (!found) {
        found = { month: monthStr, list: [] };
        monthlyData.push(found);
        saveData();
        updateMonthSelectorUI();
      }
      activeList = found.list;

      const preview = document.getElementById('hud-preview');
      if (preview) {
        preview.innerText = `현재 선택: ${currentMonth} (등록 ${activeList.length}명)`;
      }

      renderToGlasses(
        `${currentMonth} 대기 중`,
        `교인 이름을 부르면 기도제목이 뜹니다.\n(등록된 인원: ${activeList.length}명)`
      );
    }

    function matchNameAndDisplay(spoken) {
      const clean = spoken.replace(/\s+/g, '');
      const matched = activeList.find(p => clean.includes(p.name.replace(/\s+/g, '')));

      const statusText = document.getElementById('status-text');
      const preview = document.getElementById('hud-preview');

      if (matched) {
        const header = `${matched.name} ${matched.title} (${currentMonth})`;
        renderToGlasses(header, matched.prayer);

        if (preview) {
          preview.innerHTML = `<b style="color:#2b6cb0;">[안경 표시 중]</b> ${header}<br/>${matched.prayer}`;
        }
        if (statusText) {
          statusText.innerText = `음성 일치: "${matched.name}" 성도님 기도제목 호출 완료`;
        }
      } else {
        if (statusText) {
          statusText.innerText = `인식된 음성: "${spoken}" (등록 명단에 없음)`;
        }
      }
    }

    function initSTT() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const micBadge = document.getElementById('mic-badge');

      if (!SpeechRecognition) {
        if (micBadge) micBadge.innerText = '음성인식 미지원';
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        if (micBadge) {
          micBadge.innerText = '음성인식 작동 중';
          micBadge.className = 'badge active-badge';
        }
      };

      recognition.onresult = (event) => {
        const last = event.results.length - 1;
        const spoken = event.results[last][0].transcript.trim();
        matchNameAndDisplay(spoken);
      };

      recognition.onerror = (e) => {
        console.error('STT 오류:', e);
      };

      recognition.onend = () => {
        try { recognition.start(); } catch (e) {}
      };

      try {
        recognition.start();
      } catch (e) {
        console.error('STT 시작 오류:', e);
      }
    }

    async function init() {
      loadData();

      const bridgeBadge = document.getElementById('bridge-badge');
      const statusText = document.getElementById('status-text');

      bridge = await getEvenBridge();

      if (bridge) {
        if (bridgeBadge) {
          bridgeBadge.innerText = 'G2 안경 연결됨';
          bridgeBadge.className = 'badge active-badge';
        }
        if (statusText) {
          statusText.innerText = '안경과 정상 연동되었습니다. 이름을 말씀하세요.';
        }
        if (typeof bridge.onEvenHubEvent === 'function') {
          bridge.onEvenHubEvent(() => {
            renderToGlasses(`${currentMonth} 대기 중`, `교인 이름을 부르면 기도제목이 뜹니다.`);
          });
        }
      } else {
        if (bridgeBadge) bridgeBadge.innerText = '스마트폰 단독 모드';
        if (statusText) statusText.innerText = '안경 연결 대기 중 (폰 단독 동작 가능)';
      }

      initSTT();

      const selector = document.getElementById('month-select');
      selector?.addEventListener('change', () => {
        setActiveMonth(selector.value);
      });

      document.getElementById('btn-save')?.addEventListener('click', () => {
        const nameEl = document.getElementById('input-name');
        const titleEl = document.getElementById('input-title');
        const prayerEl = document.getElementById('input-prayer');

        const name = nameEl.value.trim();
        const title = titleEl.value.trim() || '성도';
        const prayer = prayerEl.value.trim();

        if (!name || !prayer) {
          alert('이름과 기도제목을 입력해주세요.');
          return;
        }

        let currentMonthGroup = monthlyData.find(m => m.month === currentMonth);
        if (!currentMonthGroup) {
          currentMonthGroup = { month: currentMonth, list: [] };
          monthlyData.push(currentMonthGroup);
        }

        const existing = currentMonthGroup.list.find(p => p.name === name);
        if (existing) {
          existing.title = title;
          existing.prayer = prayer;
        } else {
          currentMonthGroup.list.push({
            id: Date.now().toString(),
            name,
            title,
            prayer
          });
        }

        saveData();
        updateMonthSelectorUI();
        setActiveMonth(currentMonth);

        nameEl.value = '';
        titleEl.value = '';
        prayerEl.value = '';
        alert(`${name} ${title}님의 기도제목이 저장되었습니다.`);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
